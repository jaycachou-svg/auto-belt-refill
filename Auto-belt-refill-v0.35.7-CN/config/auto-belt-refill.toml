# Auto-Belt-Refill
# 腰带自动补货插件。修改后需重启游戏生效。
# 药水代码：hp5：超级治疗药水；hp4：高级治疗药水；hp3：治疗药水；hp2：次级治疗药水；hp1：初级治疗药水 | mp5~mp1 法力药水由高到低 | rvl大紫 rvs小紫
# 其他基础消耗品代码：vps：耐力药剂；yps：解毒药水；wms：解冻药水；tsc：城镇传送卷轴；isc：鉴定卷轴
# mod 自定义消耗品：直接填物品代码即可，无需其他设置
[general]
# 插件总开关。false = 插件完全停用
enabled = true

# 手动补满快捷键：按一下，按各列记忆把腰带补满，如：fill_key = "F9"
# 游戏内快捷键设置界面也可以设置，如果toml和游戏内设置冲突，以游戏内设置为准
fill_key = ""

# 快照快捷键：把当前腰带热键行（最下面一行，按键 1-4 对应的那行）各列的消耗品类型记为补给记忆，如：snapshot_key = "F8"
# 可以更新腰带记忆的方法有两种：
# 第一种，使用快照键强制更新记忆，多适用于手动补给模式
# 第二种，玩家手动将腰带消耗品栏某一列的前两行更改成某种类型消耗，多用于自动补给模式
snapshot_key = ""

# 自动补给模式：持续自动补货功能开关，确认消耗后自动补给。默认开启
auto_refill = true

# 自动补货的轮询间隔，单位=帧（60fps 下 15 帧 ≈ 0.25 秒）。每次轮询只读一次
# 根据自身电脑调整，负载并不大，有多重自定唤醒休眠机制；数值越小反应越快。有效范围 2~360，
# 超出范围按边界取值。改完重启游戏生效
auto_poll_frames = 5

# 诊断日志总开关（默认关闭，平时不要开）：控制所有排查用日志——游戏槽位查询观测、逐格腰带快照、记忆变化、每次补货请求明细
# 关闭时正常游玩只写少量关键行（版本、补货触发与结果、拒绝原因、监控链状态），日志文件增长很慢。只在补货异常需要排查时打开
debug_logs = false

# 同类优先补大号开关：血药 hp5 优先于 hp4，大紫 rvl 优先于小紫 rvs。
# 自动记忆的列按此规则从大到小找货；各列consumables若未指定优先级，也按此规则运行。
prefer_large = true

# ---------------- 每列设置 ----------------
# 不写的列 = 未分配，由游戏内行为自动记忆
# 示例：
# [column1] #column1表示设置第1列腰带消耗品栏位属性
# consumables #中填入这一列玩家自定义的消耗品，补给优先级从前往后以此降低
# consumables = ["rvl", "hp5", "hp4"] #表示，优先补给大紫，然后再是超级治疗药水，高级治疗药水
# consumables = ["mp5", "mp4", "mp3", "mp2", "mp1"] #表示补给全部5种mp药剂，其中优先补mp5超级法力药水
# consumables = [] #括号内不给内容 = 不指定，使用游戏内自动记忆（留空 同样视为不指定）
# locked = true  #表示锁定本列，插件只按上面的consumables列表补，无视插件的手动放置、拾取、快照键等改变本列补给类型的规则。
#				（ps：这一列永远是consumables内的消耗品，永不改变，玩家也无法在游戏中临时调整该列补给类型了。）
#				（ps：locked=true 的列若被游戏拒绝，插件不会越过游戏基本机制强行补货，主要指一列消耗品种类不同时，游戏本体会锁定第一格物品类型）
# locked = false #表示不锁本列，允许游戏内"往热键行放消耗品"或"按 snapshot_key快捷键"更新本列补给记忆
#				（ps：玩家在游戏中想自己改变某一列补给类型，需将本列下面两行手动换成某一种类型的消耗品，或者按下snapshot_key更新当前补给类型记忆）

# 设置第1列腰带消耗品栏位属性：
[column1]
consumables = []
locked = false

# 设置第2列腰带消耗品栏位属性：
[column2]
consumables = []
locked = false

# 设置第3列腰带消耗品栏位属性：
[column3]
consumables = []
locked = false

# 设置第4列腰带消耗品栏位属性：
[column4]
consumables = []
locked = false
